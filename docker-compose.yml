version: "3.8"

services:
  db:
    image: postgres:17.4-alpine3.21
    container_name: PaperlessDB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - paperless-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - paperless-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://${ELASTICSEARCH_HOST}:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - paperless-network
     
  minio:
    image: minio/minio
    container_name: MinIO
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 5
    volumes:
      - minio_data:/data
    networks:
      - paperless-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: RabbitMQ
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && nc -z localhost 5672"]
      interval: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - paperless-network

  ocrworker:
    build:
      context: .
      dockerfile: PaperlessServices/OcrWorker/Dockerfile
    container_name: OcrWorker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MINIO_ENDPOINT: ${MINIO_HOST}:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ELASTICSEARCH_URL: http://${ELASTICSEARCH_HOST}:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - paperless-network

  genaiworker:
    container_name: GenAIWorker
    build:
      context: ./PaperlessServices/GenAIWorker
      dockerfile: Dockerfile
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - paperless-network

  api:
    build:
      context: .
      dockerfile: ./PaperlessREST/Dockerfile
    container_name: PaperlessREST
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      MINIO_ENDPOINT: ${MINIO_HOST}:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ELASTICSEARCH_URL: http://${ELASTICSEARCH_HOST}:9200
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "PaperlessAPI"
      Jwt__Audience: "PaperlessClient"
    labels:
      - com.docker.compose.rebuild=true
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - paperless-network

  web:
    build:
      context: ./PaperlessWebUI
      dockerfile: Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-1}
    container_name: PaperlessWebUI
    labels:
      - com.docker.compose.rebuild=true
    depends_on:
      - api
    networks:
      - paperless-network
      - secure_web_net

networks:
  paperless-network:
    driver: bridge
  secure_web_net:
    external: true

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  elasticsearch_data:
