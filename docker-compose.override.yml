version: "3.9"

services:
  db:
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      retries: 5

  elasticsearch:
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  
  kibana:
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${MINIO_HOST}:9000/minio/health/live"]
      interval: 5s
      retries: 5

  rabbitmq:
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI

  api:
    ports:
      - "5000:5000"

  web:
    ports:
      - "8080:80"
    networks:
      - paperless-network

networks:
  paperless-network:
    driver: bridge
  secure_web_net:
    external: false
    driver: bridge

